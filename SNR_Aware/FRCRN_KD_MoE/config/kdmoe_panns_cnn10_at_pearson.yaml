# KD-MoE PANNs CNN10 + 3 expert theo SNR + Attention Transfer từ teacher BEATs, khớp bằng khoảng cách Pearson.
# AT (Zagoruyko & Komodakis, ICLR 2017): CNN10 block 3 <-> BEATs layer 6, block 4 <-> layer 12 (teacher_crossfit_rollout.pt,
# bản đồ = attention rollout, Abnar & Zuidema ACL 2020). Loss = 1 - Pearson (DIST, Huang et al., NeurIPS 2022).
# Front-end/kiến trúc CNN10 theo audioset_tagging_cnn (32 kHz, hann 1024, hop 320, 64 mel 50-14000 Hz);
# SpecAugment theo Cnn10 gốc (2 dải tần rộng 8, 2 dải thời gian rộng 64); lr 1e-4 theo
# panns_transfer_to_gtzan (fine-tune PANNs, batch 32, lr 1e-4).
model:
  encoder: panns_cnn10
  panns_checkpoint: https://zenodo.org/record/3987831/files/Cnn10_mAP%3D0.380.pth?download=1
  use_gate: true
  gate_eps: 0.05
  gate_bias_init: 2.0
  patch_size: 16          # NoiseHead: mỗi ô feature map CNN10 (mel/16 x T/16) dựng lại 16x16 log-mel nhiễu
  freq_bins: 64
  num_frames: 400
  num_classes: 36
  route_by: snr           # 3 expert: [-5, 5), [5, 15), [15, 20] dB
  snr_band_edges: [5.0, 15.0]
  num_groups: 3
  expert_hidden: 256
  router_hidden: 64
  dropout: 0.1
  inference_mode: weighted
  at_blocks: [3, 4]
  specaug_freq_masks: 2
  specaug_freq_width: 8
  specaug_time_masks: 2
  specaug_time_width: 64

frontend:
  sample_rate: 16000

loss:
  label_smoothing: 0.1
  kd_temperature: 2.0
  kd_weight: 1.0
  kd_target: logits       # KD Hinton 2015 trên 36 logit; teacher không biết SNR nên không KD vào router
  kd_weight_by_snr: false
  route_ce_weight: 1.0    # router học khoảng SNR thật của clip
  front_weight: 1.0
  front_lam_over: 2.0
  cons_weight: 0.1
  at_weight: 2.0          # beta của DIST cho phân loại (CIFAR-100 / ImageNet)
  at_loss: pearson        # chỉ khớp hình dạng bản đồ, không ép student làm phẳng

train:
  lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  grad_clip: 1.0
  batch_size: 64
  eval_batch_size: 64
  epochs: 50
  patience: 8
  stage1_epochs: 8
  ema_decay: 0.999
  amp: bf16
  seed: 42
  resume_every: 1
